<div class="planner-box" style="text-align:center;">
  <h2>⏱️ Focus Timer</h2>
  <p>Study for 25 minutes, then take a 5-minute break.</p>

  <div id="timerDisplay" style="font-size:55px;font-weight:bold;margin:25px;">
    25:00
  </div>

  <button onclick="startTimer()">▶️ Start</button>
  <button onclick="pauseTimer()">⏸️ Pause</button>
  <button onclick="resetTimer()">🔄 Reset</button>
</div>
